name: Preview channel

# Runs when a release is published and it is a pre-release (GitLab pipeline or by hand).
# Trigger is "published" + prerelease filter, not "prereleased": GitHub does not fire
# "prereleased" for pre-releases published from a draft, which is how the GitLab
# upload job works (draft -> upload assets -> publish).
# The pipeline itself lives in channel.yml (shared by preview and stable).

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: channel-preview
  cancel-in-progress: false

jobs:
  channel:
    name: Preview
    if: github.event.release.prerelease
    uses: $/.github/workflows/channel.yml
    with:
      channel: preview
    permissions:
      contents: read
