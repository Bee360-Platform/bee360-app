name: Channel update (reusable)

# Shared pipeline for the preview and stable channels, called by preview.yml and stable.yml.
# Version guard -> signature verification -> Homebrew cask -> winget.
#
# Security model
# - Secrets live only in the environment "release" (deployment policy: branch main, tags v*);
#   jobs that need them declare the environment here, nothing is passed from the caller.
# - Tags v* can only be created by the GitHub App and org admins (repository ruleset).
# - Nothing is distributed unless the Windows/Apple code signature matches our identity.

on:
  workflow_call:
    inputs:
      channel:
        description: "preview or stable"
        required: true
        type: string

permissions: {}

env:
  TAP_REPO: Bee360-Platform/homebrew-tap
  WINGET_FORK_OWNER: bee360-winget
  KOMAC_VERSION: 2.17.1
  KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      newer: ${{ steps.check.outputs.newer }}
      version: ${{ steps.check.outputs.version }}
      cask: ${{ steps.check.outputs.cask }}
      winget_id: ${{ steps.check.outputs.winget_id }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            preview) cask="bee360@preview"; winget_id="Bee360.Bee360.Preview"; filter=() ;;   # compare against all releases
            stable)  cask="bee360";         winget_id="Bee360.Bee360";         filter=(--exclude-pre-releases --exclude-drafts) ;;
            *) echo "::error::Invalid channel '${CHANNEL}'"; exit 1 ;;
          esac
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag '${TAG}' (expected vX.Y.Z)"; exit 1; }
          current="${TAG#v}"
          {
            echo "version=${current}"
            echo "cask=${cask}"
            echo "winget_id=${winget_id}"
          } >> "$GITHUB_OUTPUT"
          highest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 "${filter[@]}" --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | { grep -vxF "$current" || true; } | sort -V | tail -n1)
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$current" | sort -V | tail -n1)" = "$current" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          else
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${current} is older than ${highest} (backport) – ${CHANNEL} channel not updated"
          fi

  verify-macos:
    name: Verify macOS signature
    needs: guard
    if: needs.guard.outputs.newer == 'true'
    runs-on: macos-latest
    permissions: {}
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - id: verify
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Repository variable APPLE_TEAM_ID missing/invalid"; exit 1; }
          dmg="Bee360-app_${VERSION}.dmg"
          curl -fsSL -o "$dmg" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${dmg}"
          sha=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          app="${mnt}/Bee360.app"
          [ -d "$app" ] || { echo "::error::Bee360.app not found in ${dmg}"; exit 1; }

          codesign --verify --deep --strict "$app"
          team=$(codesign -dv --verbose=2 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ "$team" = "$APPLE_TEAM_ID" ] || { echo "::error::Unexpected TeamIdentifier '${team}'"; exit 1; }
          spctl --assess --type execute -vv "$app" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt || { echo "::error::App is not notarized"; exit 1; }
          echo "::notice::${dmg}: signed by team ${team}, notarized, sha256 ${sha}"

  verify-windows:
    name: Verify Windows signatures
    needs: guard
    if: needs.guard.outputs.newer == 'true' && vars.WINGET_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
          WINDOWS_SIGNER_CN: ${{ vars.WINDOWS_SIGNER_CN }}
        run: |
          set -euo pipefail
          [ -n "$WINDOWS_SIGNER_CN" ] || { echo "::error::Repository variable WINDOWS_SIGNER_CN missing"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode >/dev/null
          for kind in oneclick deployment; do
            msi="bee360_${kind}_installer_${VERSION}_x64.msi"
            curl -fsSL -o "$msi" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${msi}"
            osslsigncode verify -in "$msi" \
              -CAfile /etc/ssl/certs/ca-certificates.crt -TSA-CAfile /etc/ssl/certs/ca-certificates.crt | tee verify.txt
            grep -q "Signature verification: ok" verify.txt || { echo "::error::Invalid signature on ${msi}"; exit 1; }
            grep -qF "CN=${WINDOWS_SIGNER_CN}" verify.txt || { echo "::error::Unexpected signer on ${msi}"; exit 1; }
            echo "::notice::${msi}: signature ok, signer CN=${WINDOWS_SIGNER_CN}"
          done

  homebrew:
    name: Homebrew cask
    needs: [guard, verify-macos]
    if: needs.guard.outputs.newer == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BEE360_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BEE360_APP_RELEASE_PRIVATE_KEY }}
          owner: Bee360-Platform
          repositories: homebrew-tap
          permission-contents: write

      - name: Update cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CASK: ${{ needs.guard.outputs.cask }}
          VERSION: ${{ needs.guard.outputs.version }}
          SHA256: ${{ needs.verify-macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          # SHA256 of exactly the DMG that passed signature verification
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No valid SHA256 from verification"; exit 1; }
          path="Casks/${CASK}.rb"
          meta=$(gh api "repos/${TAP_REPO}/contents/${path}")
          blob=$(jq -r .sha <<<"$meta")
          jq -r .content <<<"$meta" | base64 -d \
            | sed -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" > cask.rb
          if ! grep -qF "version \"${VERSION}\"" cask.rb || ! grep -qF "sha256 \"${SHA256}\"" cask.rb; then
            echo "::error::Cask could not be updated"; exit 1
          fi
          gh api -X PUT "repos/${TAP_REPO}/contents/${path}" \
            -f message="${CASK} ${VERSION}" -f sha="$blob" -f content="$(base64 -w0 cask.rb)" >/dev/null
          echo "::notice::${CASK} updated to ${VERSION}"

  winget:
    name: winget
    needs: [guard, verify-windows]
    # Enabled once the machine account exists and the package was submitted once by hand (O5, O10)
    if: needs.guard.outputs.newer == 'true' && vars.WINGET_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Install Komac (pinned, checksum verified)
        run: |
          set -euo pipefail
          f="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$f" "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${f}"
          echo "${KOMAC_SHA256}  ${f}" | sha256sum -c -
          tar xzf "$f" komac
          sudo install -m 0755 komac /usr/local/bin/komac

      - name: Submit to winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: ${{ env.WINGET_FORK_OWNER }}
          KOMAC_CREATED_WITH: bee360-app release workflow
          WINGET_ID: ${{ needs.guard.outputs.winget_id }}
          VERSION: ${{ needs.guard.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          komac update "$WINGET_ID" --version "$VERSION" \
            --urls "${base}/bee360_oneclick_installer_${VERSION}_x64.msi" "${base}/bee360_deployment_installer_${VERSION}_x64.msi" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --submit
