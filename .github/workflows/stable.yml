name: Stable channel

# Runs when a release is published as stable or promoted from pre-release (promote.yml or by hand).
# The pipeline itself lives in channel.yml (shared by preview and stable).

on:
  release:
    types: [released]

permissions: {}

concurrency:
  group: channel-stable
  cancel-in-progress: false

jobs:
  channel:
    name: Stable
    uses: $/.github/workflows/channel.yml
    with:
      channel: stable
    permissions:
      contents: read
    # Needed so that the environment secrets of "release" resolve in the called
    # workflow's jobs (they arrive empty otherwise, see actions/runner#4453).
    # The repo has no repository or organization secrets; all secrets live in the environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]
