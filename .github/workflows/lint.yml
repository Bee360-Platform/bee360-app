name: Workflow security checks

# Required status checks for pull requests that touch GitHub Actions workflows.
# - actionlint (incl. shellcheck for run: scripts): syntax, expressions, shell issues
# - zizmor: security linter for GitHub Actions (template injection, permissions,
#   unpinned actions, dangerous triggers, impostor commits, known-vulnerable actions)
# Tools are installed with fixed versions and verified checksums/hashes.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.31.1
  ZIZMOR_SHA256: 58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (pinned, checksum verified)
        run: |
          set -euo pipefail
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${f}"
          echo "${ACTIONLINT_SHA256}  ${f}" | sha256sum -c -
          tar xzf "$f" actionlint
          command -v shellcheck >/dev/null || { echo "::error::shellcheck missing on runner"; exit 1; }

      - name: Run actionlint (with shellcheck)
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor (pinned, hash verified)
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/zizmor"
          echo "zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}" > "${RUNNER_TEMP}/req.txt"
          "${RUNNER_TEMP}/zizmor/bin/pip" install --quiet --no-deps --require-hashes -r "${RUNNER_TEMP}/req.txt"

      - name: Run zizmor
        env:
          # read-only token for online audits (impostor commits, known-vulnerable actions)
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/zizmor/bin/zizmor" --format=github .github/workflows/'
