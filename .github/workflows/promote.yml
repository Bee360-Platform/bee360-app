name: Promote to stable

# Promotes a pre-release to stable with cumulative release notes since the last stable release.
# Uses the GitHub App token so that the resulting "released" event triggers stable.yml
# (events caused by GITHUB_TOKEN do not trigger other workflows).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, e.g. 2.11.5"
        required: true
        type: string
      release_number:
        description: "Optional release number for the title, e.g. 2026.02"
        required: false
        type: string

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BEE360_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.BEE360_APP_RELEASE_PRIVATE_KEY }}
          repositories: bee360-app
          permission-contents: write

      - name: Promote
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_NUMBER: ${{ inputs.release_number }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid version '${INPUT_VERSION}'"; exit 1; }
          [ -z "$RELEASE_NUMBER" ] || [[ "$RELEASE_NUMBER" =~ ^[0-9]{4}\.[0-9]{2}$ ]] \
            || { echo "::error::Invalid release number '${RELEASE_NUMBER}' (expected YYYY.NN)"; exit 1; }
          TAG="v${VERSION}"

          ver_gt() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -s 'add')

          state=$(jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | if .prerelease then "pre" else "stable" end' <<<"$releases")
          [ -n "$state" ] || { echo "::error::Release ${TAG} not found"; exit 1; }
          [ "$state" = "pre" ] || { echo "::error::${TAG} is already stable"; exit 1; }

          last_stable=$(jq -r '.[] | select(.prerelease==false and .draft==false) | .tag_name | ltrimstr("v")' <<<"$releases" \
            | sort -V | tail -n1)

          latest_flag="--latest"
          if [ -n "$last_stable" ] && ! ver_gt "$VERSION" "$last_stable"; then
            # Backport to an older line: keep own notes, do not take over "latest"
            echo "::notice::${VERSION} is not newer than current stable ${last_stable} – promoted without 'latest'"
            jq -r --arg t "$TAG" '.[] | select(.tag_name==$t) | .body' <<<"$releases" > notes.md
            latest_flag="--latest=false"
          else
            {
              echo "# Changes since ${last_stable:-the first release}"
              echo
              jq -r '.[] | select(.draft==false) | .tag_name | ltrimstr("v")' <<<"$releases" | sort -Vr \
                | while read -r v; do
                    ver_gt "$v" "$VERSION" && continue                               # newer than promoted version
                    [ -n "$last_stable" ] && ! ver_gt "$v" "$last_stable" && continue # not newer than last stable
                    # New line (e.g. 2.9.x -> 2.11.x): skip further patches of the old stable line (backports)
                    [ -n "$last_stable" ] && [ "${VERSION%.*}" != "${last_stable%.*}" ] \
                      && [ "${v%.*}" = "${last_stable%.*}" ] && continue
                    jq -r --arg t "v${v}" '.[] | select(.tag_name==$t) | .body // ""' <<<"$releases"
                    echo
                  done
            } > notes.md
          fi

          if [ -n "$RELEASE_NUMBER" ]; then title="bee360 ${RELEASE_NUMBER} (${VERSION})"; else title="bee360 ${VERSION}"; fi

          {
            echo "## Promote ${TAG}"
            echo "- Title: ${title}"
            echo "- Last stable: ${last_stable:-none}"
            echo
            echo "### Release notes"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false $latest_flag --title "$title" --notes-file notes.md
          echo "::notice::${TAG} promoted to stable as '${title}'"
